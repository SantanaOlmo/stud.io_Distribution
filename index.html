<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/stud.io_Distribution/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12181e" />
    <meta
      name="description"
      content="estud.io — memoriza textos palabra por palabra, sin conexión."
    />
    <link rel="apple-touch-icon" href="/stud.io_Distribution/icons/icon-book-192.png" />
    <title>estud.io</title>
    <script type="module" crossorigin src="/stud.io_Distribution/assets/index-CuSQ1Jn5.js"></script>
    <link rel="stylesheet" crossorigin href="/stud.io_Distribution/assets/index-DkfWLXxM.css">
  <link rel="manifest" href="/stud.io_Distribution/manifest.webmanifest"></head>
  <body>
    <script>
      try {
        var dark = localStorage.getItem('estud.io:theme') === 'dark'
        var wallpaperOn =
          localStorage.getItem('estud.io:wallpaper-active') === '1'
        var chrome = wallpaperOn ? '#000000' : dark ? '#12181e' : '#f2f6fb'
        if (dark) document.documentElement.setAttribute('data-theme', 'dark')
        if (wallpaperOn)
          document.documentElement.classList.add('has-wallpaper')
        document.documentElement.style.backgroundColor = chrome
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', chrome)
      } catch (e) {}
    </script>
    <div id="root"></div>
  </body>
</html>
