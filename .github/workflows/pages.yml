name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # No cancelar a mitad: evita dejar Pages a medias si llegan dos pushes seguidos
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site folder
        run: |
          set -euo pipefail
          mkdir -p _site
          # Publicar el sitio sin .git ni workflows (sí incluir .nojekyll y build-info)
          shopt -s dotglob nullglob
          for item in * .*; do
            case "$item" in
              .|..|.git|.github|_site) continue ;;
            esac
            cp -a "$item" _site/
          done
          test -f _site/index.html
          test -f _site/.nojekyll || touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
